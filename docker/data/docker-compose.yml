name: llamafly-marketplace-data

volumes:
  # pgadmin-data:
  llamafly-auth-postgres-data:
  llamafly-profile-postgres-data:
  llamafly-product-postgres-data:
  llamafly-product-redis-data:
  # image-redis-data:

services:
  # pgadmin.general:
  #   image: docker.io/dpage/pgadmin4:9.0.0
  #   container_name: pgadmin.general
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin

  auth.db:
    image: docker.io/postgres:17.3-alpine
    container_name: new_auth.db
    volumes:
      - ./postgresql/init-scripts:/docker-entrypoint-initdb.d
      - llamafly-auth-postgres-data:/var/lib/postgresql/data

  profile.db:
    image: docker.io/postgres:17.3-alpine
    container_name: new_profile.db
    volumes:
      - ./postgresql/init-scripts:/docker-entrypoint-initdb.d
      - llamafly-profile-postgres-data:/var/lib/postgresql/data

  product.db:
    image: docker.io/postgres:17.3-alpine
    container_name: new_product.db
    volumes:
      - ./postgresql/init-scripts:/docker-entrypoint-initdb.d
      - llamafly-product-postgres-data:/var/lib/postgresql/data
      # - product-postgres-data:/var/lib/postgresql/data

  product.redis:
    image: redis:latest
    container_name: new_product.redis
    volumes:
      - llamafly-product-redis-data:/data

  # image.redis:
